<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HANGMAN DELUXE - Của Pu cte ne</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #111827;
      color: #f9fafb;
      padding: 18px;
    }
    .game {
      width: min(100%, 520px);
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 22px;
      padding: 24px;
      text-align: center;
    }
    h1 { margin: 0 0 4px; font-size: 30px; }
    .owner { color: #cbd5e1; margin-bottom: 20px; }
    .hint {
      font-size: 34px;
      letter-spacing: 5px;
      margin: 18px 0;
      min-height: 48px;
    }
    .word {
      font-size: 30px;
      letter-spacing: 9px;
      margin: 18px 0;
      min-height: 42px;
      font-weight: bold;
    }
    .lives { margin: 12px 0; }
    input {
      width: 90px;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #4b5563;
      background: #111827;
      color: white;
      text-align: center;
      font-size: 20px;
      text-transform: lowercase;
    }
    button {
      padding: 12px 18px;
      margin-left: 8px;
      border: 0;
      border-radius: 12px;
      background: #22c55e;
      color: #052e16;
      font-weight: bold;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover { opacity: .9; }
    button.secondary { background: #64748b; color: white; margin: 12px 0 0; }
    .message {
      min-height: 28px;
      margin: 16px 0;
      font-weight: bold;
    }
    .guessed {
      color: #cbd5e1;
      font-size: 14px;
      min-height: 22px;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <main class="game">
    <h1>🎮 HANGMAN DELUXE 🎮</h1>
    <div class="owner">Của Pu cte ne ✨</div>

    <div>📚 Chủ đề: Môn Học 📝</div>
    <div id="hint" class="hint"></div>
    <div id="word" class="word"></div>
    <div id="lives" class="lives">💔 Mạng còn lại: 10</div>

    <div>
      <input id="guess" maxlength="1" autocomplete="off" aria-label="Đoán chữ">
      <button id="guessBtn">Đoán chữ</button>
    </div>

    <div id="message" class="message"></div>
    <div id="guessed" class="guessed"></div>
    <button id="restart" class="secondary">🔄 Chơi lại</button>
  </main>

  <script>
    const duLieu = [
      { tu: "IT", goi_y: "💻🖥🖱⌨💾🔌" },
      { tu: "Maths", goi_y: "📏🎲📐" },
      { tu: "English", goi_y: "🅰🅱🅾👩🏻🦁" },
      { tu: "History", goi_y: "🧍‍♀️🧍‍♂️🐵📅📆" },
      { tu: "Geography", goi_y: "🌕🌞🌏🪐🕐" },
      { tu: "Music", goi_y: "🎶🔊🎼🎹🎻" }
    ];

    let cauHoi, dapAn, mang, chuDaDoan, ketThuc;

    const hintEl = document.getElementById("hint");
    const wordEl = document.getElementById("word");
    const livesEl = document.getElementById("lives");
    const messageEl = document.getElementById("message");
    const guessedEl = document.getElementById("guessed");
    const inputEl = document.getElementById("guess");

    function batDau() {
      cauHoi = duLieu[Math.floor(Math.random() * duLieu.length)];
      dapAn = cauHoi.tu;
      mang = 10;
      chuDaDoan = [];
      ketThuc = false;

      hintEl.textContent = "🔑 " + cauHoi.goi_y;
      messageEl.textContent = "";
      inputEl.value = "";
      inputEl.disabled = false;
      document.getElementById("guessBtn").disabled = false;
      hienThi();
      inputEl.focus();
    }

    function hienThi() {
      const hienThiTu = [...dapAn].map(chu =>
        chuDaDoan.includes(chu.toLowerCase()) ? chu : "_"
      ).join(" ");

      wordEl.textContent = hienThiTu;
      livesEl.textContent = "💔 Mạng còn lại: " + mang;
      guessedEl.textContent = chuDaDoan.length
        ? "🔤 Đã đoán: " + chuDaDoan.join(", ")
        : "";

      if ([...dapAn].every(chu => chuDaDoan.includes(chu.toLowerCase()))) {
        messageEl.textContent = "CHÚC MỪNG 🎉 BẠN ĐÃ THẮNG GAME CỦA PUU!";
        ketThuc = true;
        khoaGame();
      }
    }

    function doanChu() {
      if (ketThuc) return;

      const chu = inputEl.value.trim().toLowerCase();
      inputEl.value = "";

      if (!chu) return;
      if (!/^[a-z]$/.test(chu)) {
        messageEl.textContent = "⚠️ Hãy nhập 1 chữ cái nha!";
        return;
      }
      if (chuDaDoan.includes(chu)) {
        messageEl.textContent = "😗 Chữ này đoán rồi!";
        return;
      }

      chuDaDoan.push(chu);

      if (dapAn.toLowerCase().includes(chu)) {
        messageEl.textContent = "🎊 Đúng rồi!!!!!! 🎉";
      } else {
        messageEl.textContent = "❌ Sai rồi!!!!!!!!!!";
        mang--;
      }

      if (mang === 0) {
        messageEl.textContent = "💀 Hết mạng rồi!!!!";
        wordEl.textContent = [...dapAn].join(" ");
        messageEl.textContent += " Đáp án đúng là: " + dapAn;
        ketThuc = true;
        khoaGame();
        hienThi();
        return;
      }

      hienThi();
    }

    function khoaGame() {
      inputEl.disabled = true;
      document.getElementById("guessBtn").disabled = true;
    }

    document.getElementById("guessBtn").addEventListener("click", doanChu);
    inputEl.addEventListener("keydown", e => {
      if (e.key === "Enter") doanChu();
    });
    document.getElementById("restart").addEventListener("click", batDau);

    batDau();
  </script>
</body>
</html>
